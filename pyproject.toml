[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "aios"
version = "0.1.0"
description = "AI Agent Operating System"
requires-python = ">=3.11"


[tool.setuptools.packages.find]
include = ["aios*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.ruff]
line-length = 88
target-version = "py311"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]


[tool.mypy]
python_version = "3.11"
strict = true